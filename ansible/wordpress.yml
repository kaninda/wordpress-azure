- name: Installer WordPress sur vm-app
  hosts: az-app
  become: true

  vars:
    php_version: "8.3"                 # version par défaut d'Ubuntu 24.04
    wp_dir: /var/www/wordpress
    mysql_fqdn: "{{ lookup('pipe', 'terraform -chdir=../terraform output -raw mysql_fqdn') }}"
    mysql_password: "{{ kv['mysql-admin-password'] }}" # temporaire : remplacé par wpuser en 12c

    # Lus dans les outputs Terraform, comme mysql_fqdn
    storage_account: "{{ lookup('pipe', 'terraform -chdir=../terraform output -raw storage_account_name') }}"
    storage_share: "{{ lookup('pipe', 'terraform -chdir=../terraform output -raw storage_share_name') }}"
    storage_key: "{{ kv['storage-account-key'] }}" # lu dans Key Vault (set_fact plus bas)
    uploads_dir: "{{ wp_dir }}/wp-content/uploads"
    smb_cred_file: "/etc/smbcredentials/{{ storage_account }}.cred"
    kv_name: "{{ lookup('pipe', 'terraform -chdir=../terraform output -raw key_vault_name') }}"

    # Options de montage CIFS, jointes par des virgules (pas d'espace : fstab les sépare par espaces)
    smb_mount_opts:
      - vers=3.1.1                         # SMB chiffré (secure transfer required)
      - "credentials={{ smb_cred_file }}"  # clé hors de fstab
      - uid=www-data                       # CIFS ignore chown : propriétaire fixé au montage
      - gid=www-data
      - dir_mode=0775
      - file_mode=0664
      - serverino                          # inodes stables côté serveur
      - nosharesock                        # connexion dédiée à ce montage
      - actimeo=30                         # cache des attributs : 30 s
      - _netdev                            # au boot, attendre le réseau
      - nofail                             # boot OK même si le storage est injoignable

  tasks:
    # Token de la Managed Identity, demandé à l'IMDS (exécuté SUR vm-app)
    - name: Token Managed Identity (IMDS)
      ansible.builtin.uri:
        url: "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://vault.azure.net"
        headers:
          Metadata: "true"
      register: mi_token
      no_log: true # ne jamais afficher le token

    # Lecture des 4 secrets via le PE du Key Vault
    - name: Lecture des secrets Key Vault
      ansible.builtin.uri:
        url: "https://{{ kv_name }}.vault.azure.net/secrets/{{ item }}?api-version=7.4"
        headers:
          Authorization: "Bearer {{ mi_token.json.access_token }}"
      loop:
        - storage-account-key
        - mysql-admin-password
        - wp-db-password
        - wp-salt-seed
      register: kv_secrets
      no_log: true # ne jamais afficher les secrets

    # Dictionnaire nom → valeur, ex. kv['wp-db-password']
    - name: Secrets en variable
      ansible.builtin.set_fact:
        kv: "{{ dict(kv_secrets.results | map(attribute='item') | zip(kv_secrets.results | map(attribute='json') | map(attribute='value'))) }}"
      no_log: true

    - name: Installer Nginx, PHP-FPM, extensions WordPress et client MySQL
      ansible.builtin.apt:
        name:
          - nginx
          - php-fpm
          - php-mysql
          - php-curl
          - php-gd
          - php-mbstring
          - php-xml
          - php-zip
          - php-intl
          - mysql-client
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Démarrer PHP-FPM au boot
      ansible.builtin.service:
        name: "php{{ php_version }}-fpm"
        state: started
        enabled: true

    - name: Télécharger et décompresser WordPress
      ansible.builtin.unarchive:
        src: https://wordpress.org/latest.tar.gz
        dest: /var/www
        remote_src: true
        owner: www-data
        group: www-data
        creates: "{{ wp_dir }}/wp-settings.php"

    # Dépendance Python du module community.mysql, côté vm-app
    - name: Installer PyMySQL
      ansible.builtin.apt:
        name: python3-pymysql
        state: present

    # Compte dédié : droits limités à la base wordpress, depuis snet-app uniquement
    - name: Utilisateur MySQL dédié à WordPress
      community.mysql.mysql_user:
        login_host: "{{ mysql_fqdn }}"
        login_user: wpadmin
        login_password: "{{ kv['mysql-admin-password'] }}"
        ca_cert: /etc/ssl/certs/ca-certificates.crt # active TLS (require_secure_transport)
        name: wpuser
        host: "10.0.1.%"                # snet-app
        password: "{{ kv['wp-db-password'] }}"
        update_password: on_create      # idempotent : pas de réécriture à chaque run
        priv: "wordpress.*:ALL"
        state: present
      no_log: true
      
    - name: Générer wp-config.php
      ansible.builtin.template:
        src: wp-config.php.j2
        dest: "{{ wp_dir }}/wp-config.php"
        owner: www-data
        group: www-data
        mode: "0640"

    - name: Déployer la config Nginx WordPress
      ansible.builtin.template:
        src: wordpress.conf.j2
        dest: /etc/nginx/sites-available/wordpress
        mode: "0644"
      notify: Recharger Nginx

    - name: Activer le site WordPress
      ansible.builtin.file:
        src: /etc/nginx/sites-available/wordpress
        dest: /etc/nginx/sites-enabled/wordpress
        state: link
      notify: Recharger Nginx

    - name: Désactiver le site par défaut
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Recharger Nginx

    - name: Nginx démarré et activé au boot
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    # Client SMB du noyau Linux (fournit mount.cifs)
    - name: Installer cifs-utils
      ansible.builtin.apt:
        name: cifs-utils
        state: present

    # Dossier lisible par root uniquement : il contient la clé du storage
    - name: Créer le dossier des credentials SMB
      ansible.builtin.file:
        path: /etc/smbcredentials
        state: directory
        owner: root
        group: root
        mode: "0700"

    # Fichier lu par mount.cifs : évite de mettre la clé en clair dans /etc/fstab (lisible par tous)
    - name: Déposer les credentials SMB
      ansible.builtin.copy:
        dest: "{{ smb_cred_file }}"
        content: |
          username={{ storage_account }}
          password={{ storage_key }}
        owner: root
        group: root
        mode: "0600"
      no_log: true   # n'affiche pas la clé dans la sortie Ansible

    # Point de montage. Pas de owner/mode ici : une fois monté, ce sont les options
    # du montage qui décident (un chmod sur CIFS casserait l'idempotence).
    - name: Créer le point de montage
      ansible.builtin.file:
        path: "{{ uploads_dir }}"
        state: directory

    # state: mounted = écrit la ligne fstab ET monte immédiatement
    - name: Monter le partage Azure Files sur uploads
      ansible.posix.mount:
        path: "{{ uploads_dir }}"
        src: "//{{ storage_account }}.file.core.windows.net/{{ storage_share }}"
        fstype: cifs
        opts: "{{ smb_mount_opts | join(',') }}"
        state: mounted

  handlers:
    - name: Recharger Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

