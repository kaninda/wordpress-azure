- name: Installer WordPress sur vm-app
  hosts: az-app
  become: true

  vars:
    php_version: "8.3"                 # version par défaut d'Ubuntu 24.04
    wp_dir: /var/www/wordpress
    mysql_fqdn: "{{ lookup('pipe', 'terraform -chdir=../terraform output -raw mysql_fqdn') }}"
    mysql_password: "{{ lookup('env', 'TF_VAR_mysql_admin_password') }}"

  tasks:
    - name: Vérifier que le mot de passe MySQL est fourni
      ansible.builtin.assert:
        that: mysql_password | length > 0
        fail_msg: "Lance d'abord : read -s TF_VAR_mysql_admin_password && export TF_VAR_mysql_admin_password"

    - name: Installer Nginx, PHP-FPM, extensions WordPress et client MySQL
      ansible.builtin.apt:
        name:
          - nginx
          - php-fpm
          - php-mysql
          - php-curl
          - php-gd
          - php-mbstring
          - php-xml
          - php-zip
          - php-intl
          - mysql-client
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Démarrer PHP-FPM au boot
      ansible.builtin.service:
        name: "php{{ php_version }}-fpm"
        state: started
        enabled: true

    - name: Télécharger et décompresser WordPress
      ansible.builtin.unarchive:
        src: https://wordpress.org/latest.tar.gz
        dest: /var/www
        remote_src: true
        owner: www-data
        group: www-data
        creates: "{{ wp_dir }}/wp-settings.php"

    - name: Générer wp-config.php
      ansible.builtin.template:
        src: wp-config.php.j2
        dest: "{{ wp_dir }}/wp-config.php"
        owner: www-data
        group: www-data
        mode: "0640"


