- name: Serveur web
  hosts: app
  become: true

  tasks:
    - name: Installer nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3400

    - name: Deployer la page de test
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <meta charset="utf-8">
          <h1>{{ ansible_facts['hostname'] }}</h1>
          <p>Étape 03 — servi via le Load Balancer</p>
        owner: root
        group: root
        mode: "0644"

    - name: Nginx démarré et activé au boot
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

